<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <h1>Dashboard</h1>

  <div class="actions">
    <button>Profile</button>
    <button>Settings</button>
  </div>
</header>

<div class="dashboard">

  <aside class="sidebar">
    <h3>Menu</h3>

    <ul>
      <li>Home</li>
      <li>Analytics</li>
      <li>Reports</li>
      <li>Users</li>
    </ul>
  </aside>

  <main class="content">

    <div class="card">
      <h2>Total Users</h2>
      <p>12,450</p>
    </div>

    <div class="card">
      <h2>Revenue</h2>
      <p>$18,400</p>
    </div>

    <div class="card">
      <h2>Orders</h2>
      <p>1,235</p>
    </div>

    <div class="card">
      <h2>Conversion</h2>
      <p>4.6%</p>
    </div>

  </main>

</div>

</body>
</html>
